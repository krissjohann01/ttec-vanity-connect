<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Recent Vanity Numbers</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
  td:first-child, td:last-child { white-space: nowrap; }
  th { font-size: 0.8rem; text-transform: uppercase; color: #666; }
  .vanity-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .vanity-list span { background: #eef2ff; border-radius: 4px; padding: 2px 6px; font-family: monospace; }
  #status { color: #666; font-size: 0.9rem; }
  #error { color: #b00020; }
</style>
</head>
<body>
<h1>Last 5 Callers &mdash; Vanity Numbers</h1>
<p id="status">Loading&hellip;</p>
<p id="error" hidden></p>
<table id="results" hidden>
  <thead><tr><th>Caller</th><th>Top vanity numbers</th><th>When</th></tr></thead>
  <tbody></tbody>
</table>

<!-- This has to load before the script below, since that script reads window.API_URL right away. -->
<script src="config.js" onerror="console.warn('web/config.js not found yet -- see README.md')"></script>
<script>
/**
 * A simple web page, no build step needed: it fetches the last 5 callers
 * from the bonus API and shows them. API_URL comes from web/config.js
 * (which is gitignored, since it holds a real address that's different for
 * every deployment -- it's the CallersApiUrl that `cdk deploy` prints out).
 * See README.md, "Bonus web app".
 */
async function loadCallers() {
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const table = document.getElementById('results');

  if (typeof window.API_URL !== 'string' || !window.API_URL) {
    statusEl.hidden = true;
    errorEl.hidden = false;
    errorEl.textContent =
      'No API URL configured. Copy the "CallersApiUrl" output from `cdk deploy` into web/config.js as: window.API_URL = "https://...";';
    return;
  }

  try {
    const res = await fetch(window.API_URL);
    if (!res.ok) throw new Error(`API returned HTTP ${res.status}`);
    const data = await res.json();

    const tbody = table.querySelector('tbody');
    tbody.innerHTML = '';
    for (const caller of data.callers ?? []) {
      const row = document.createElement('tr');

      const callerCell = document.createElement('td');
      callerCell.textContent = caller.callerNumber;

      const vanityCell = document.createElement('td');
      const list = document.createElement('div');
      list.className = 'vanity-list';
      for (const v of caller.vanityTop5 ?? []) {
        const span = document.createElement('span');
        span.textContent = v;
        list.appendChild(span);
      }
      vanityCell.appendChild(list);

      const whenCell = document.createElement('td');
      whenCell.textContent = new Date(caller.timestamp).toLocaleString();

      row.append(callerCell, vanityCell, whenCell);
      tbody.appendChild(row);
    }

    statusEl.hidden = true;
    table.hidden = false;
    if ((data.callers ?? []).length === 0) {
      statusEl.hidden = false;
      statusEl.textContent = 'No calls logged yet -- call the Connect phone number first.';
    }
  } catch (err) {
    statusEl.hidden = true;
    errorEl.hidden = false;
    errorEl.textContent = 'Failed to load callers: ' + err.message;
  }
}

loadCallers();
</script>
</body>
</html>
